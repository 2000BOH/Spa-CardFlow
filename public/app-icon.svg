<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0052ff"/>
      <stop offset="1" stop-color="#00b4d8"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd76a"/>
      <stop offset="1" stop-color="#e0a526"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Spa water wave -->
  <path d="M0 400 Q64 372 128 400 T256 400 T384 400 T512 400 V512 H0 Z" fill="#ffffff" opacity="0.16"/>
  <path d="M0 436 Q64 410 128 436 T256 436 T384 436 T512 436 V512 H0 Z" fill="#ffffff" opacity="0.14"/>

  <!-- Spa steam (hot spring) -->
  <g fill="none" stroke="#ffffff" stroke-width="22" stroke-linecap="round">
    <path d="M190 200 C168 176 212 152 190 124 C176 106 190 90 190 90"/>
    <path d="M256 196 C234 170 278 146 256 116 C242 98 256 78 256 78"/>
    <path d="M322 200 C300 176 344 152 322 124 C308 106 322 90 322 90"/>
  </g>

  <!-- Corporate card -->
  <g transform="rotate(-6 256 330)">
    <rect x="102" y="232" width="308" height="196" rx="26" fill="#ffffff"/>
    <rect x="102" y="270" width="308" height="34" fill="#0a2a6b" opacity="0.9"/>
    <rect x="132" y="326" width="56" height="42" rx="9" fill="url(#chip)"/>
    <path d="M132 347 H188 M160 326 V368" stroke="#b9851a" stroke-width="3"/>
    <rect x="132" y="388" width="150" height="14" rx="7" fill="#0052ff" opacity="0.35"/>
    <path d="M318 360 q14 -12 28 0 t28 0" fill="none" stroke="#00b4d8" stroke-width="9" stroke-linecap="round"/>
    <path d="M318 384 q14 -12 28 0 t28 0" fill="none" stroke="#0052ff" stroke-width="9" stroke-linecap="round"/>
  </g>
</svg>
